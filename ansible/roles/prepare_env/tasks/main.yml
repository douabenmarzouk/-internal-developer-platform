

# ---- 1. Mettre à jour les paquets -------------------------
- name: Mettre à jour tous les paquets
  dnf:
    name: "*"
    state: latest
  when: update_packages | default(false)

# ---- 2. Installer Docker ----------------------------------
- name: Installer yum-utils
  dnf:
    name: yum-utils
    state: present

- name: Ajouter le repo Docker
  shell: >
    yum-config-manager --add-repo
    https://download.docker.com/linux/centos/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Installer Docker Engine
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  notify: restart docker

- name: Démarrer et activer Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: Ajouter user au groupe docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# ---- 3. Installer Git -------------------------------------
- name: Installer Git
  dnf:
    name: git
    state: present

- name: Vérifier version Git
  command: git --version
  changed_when: false
  register: git_version

- name: Afficher version Git
  debug:
    msg: "✅ {{ git_version.stdout }}"

# ---- 4. Vérifier si K3s est installé ---------------------
- name: Vérifier si K3s est installé
  stat:
    path: "{{ k3s_binary }}"
  register: k3s_binary_stat

# ---- 5. Installer K3s -------------------------------------
- name: Installer K3s
  shell: curl -sfL https://get.k3s.io | sh -
  when: not k3s_binary_stat.stat.exists
  notify: restart k3s

# ---- 6. Démarrer K3s --------------------------------------
- name: Démarrer et activer K3s
  systemd:
    name: k3s
    state: started
    enabled: true

# ---- 7. Attendre que K3s soit prêt ------------------------
- name: Attendre que K3s soit prêt
  command: k3s kubectl get nodes
  register: k3s_status
  retries: 5
  delay: 10
  until: k3s_status.rc == 0
  changed_when: false

- name: Afficher statut K3s
  debug:
    msg: "✅ K3s prêt : {{ k3s_status.stdout_lines[0] }}"

# ---- 8. Configurer kubeconfig ----------------------------
- name: Créer dossier .kube
  file:
    path: /root/.kube
    state: directory
    mode: '0755'

- name: Copier kubeconfig K3s
  copy:
    src: "{{ kubeconfig_path }}"
    dest: /root/.kube/config
    remote_src: true
    mode: '0600'

# ---- 9. Permission kubeconfig ----------------------------
- name: Donner permission kubeconfig
  file:
    path: "{{ kubeconfig_path }}"
    mode: '0644'

# ---- 10. Corriger IP kubeconfig --------------------------
- name: Corriger IP kubeconfig
  replace:
    path: "{{ kubeconfig_path }}"
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"

# ---- OPTION 1 — Image Docker directe --------------------
- name: "[OPTION 1] Vérifier image Docker"
  debug:
    msg: "✅ Option 1 — Image Docker : {{ docker_image }}"
  when: github_repo == ""

# ---- OPTION 2 — GitHub + Docker build -------------------
- name: "[OPTION 2] Supprimer ancien dossier"
  file:
    path: "{{ code_dest }}"
    state: absent
  when: github_repo != ""

- name: "[OPTION 2] Créer dossier destination"
  file:
    path: "{{ code_dest }}"
    state: directory
    mode: '0755'
  when: github_repo != ""

- name: "[OPTION 2] Cloner code depuis GitHub"
  git:
    repo: "{{ github_repo }}"
    dest: "{{ code_dest }}"
    version: "HEAD"
    force: true
  when: github_repo != ""

- name: "[OPTION 2] Confirmer clone réussi"
  debug:
    msg: "✅ Code cloné depuis {{ github_repo }}"
  when: github_repo != ""

# ---- Vérifier Dockerfile --------------------------------
- name: "[OPTION 2] Vérifier Dockerfile existe"
  stat:
    path: "{{ code_dest }}/Dockerfile"
  register: dockerfile_stat
  when: github_repo != ""

- name: "[OPTION 2] Échouer si pas de Dockerfile"
  fail:
    msg: |
      ❌ Dockerfile manquant dans {{ github_repo }} !
      Le repo doit contenir un Dockerfile à la racine.
  when: github_repo != "" and not dockerfile_stat.stat.exists

# ---- Builder image --------------------------------------
- name: "[OPTION 2] Builder image avec Docker"
  shell: |
    cd {{ code_dest }} && \
    docker build -t {{ service_name }}:latest .
  when: github_repo != ""
  register: build_result
  changed_when: true

- name: "[OPTION 2] Vérifier build réussi"
  fail:
    msg: "❌ Build Docker échoué pour {{ service_name }} !"
  when: github_repo != "" and build_result.rc != 0

- name: "[OPTION 2] Confirmer image buildée"
  debug:
    msg: "✅ Image {{ service_name }}:latest buildée !"
  when: github_repo != ""

# ---- Importer dans K3s ----------------------------------
# ---- Importer dans K3s ----------------------------------

- name: "[OPTION 2] Supprimer tar existant"
  file:
    path: "/tmp/{{ service_name }}.tar"
    state: absent
  when: github_repo != ""

- name: "[OPTION 2] Sauvegarder image en tar"
  shell: |
    docker save {{ service_name }}:latest -o /tmp/{{ service_name }}.tar
  become: true
  when: github_repo != ""
  changed_when: true

- name: "[OPTION 2] Importer image dans K3s"
  command: >
    k3s ctr images import /tmp/{{ service_name }}.tar
  become: true
  when: github_repo != ""

# ---- IMPORTANT : créer le tag attendu par Kubernetes ----

- name: "[OPTION 2] Taguer image pour Kubernetes"
  command: >
    k3s ctr images tag
    docker.io/library/{{ service_name }}:latest
    {{ service_name }}:latest
  become: true
  when: github_repo != ""

# ---- Vérifier image dans K3s ----------------------------

- name: "[OPTION 2] Vérifier réellement image dans K3s"
  shell: >
    k3s ctr images list | grep -E '(^|/){{ service_name }}:latest'
  become: true
  register: k3s_image_check
  changed_when: false
  failed_when: k3s_image_check.rc != 0
  when: github_repo != ""

- name: "[OPTION 2] Confirmer image dans K3s"
  debug:
    msg: "✅ Image {{ service_name }}:latest réellement présente dans K3s !"
  when:
    - github_repo != ""
    - k3s_image_check.rc == 0

- name: "[OPTION 2] Nettoyer fichier tar"
  file:
    path: "/tmp/{{ service_name }}.tar"
    state: absent
  when: github_repo != ""

# ---- 13. Vérifications finales ---------------------------
- name: Vérifier contexte kubectl
  command: kubectl config current-context
  register: kube_context
  changed_when: false

- name: Afficher contexte kubectl
  debug:
    msg: "Contexte kubectl : {{ kube_context.stdout }}"

- name: Tout est prêt pour Terraform
  debug:
    msg: |
      ✅ Environnement prêt !
      ─────────────────────────
      Service : {{ service_name }}
      GitHub  : {{ github_repo }}
      K3s     : {{ k3s_status.stdout_lines[0] }}
      ─────────────────────────
      Prochaine étape : terraform apply