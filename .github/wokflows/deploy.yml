
name: CI/CD IDP

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened]

jobs:

  # ---- Job 1 : Tests Backend ----------------------------
  test:
    name: 🧪 Tests Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        run: |
          cd backend
          mvn clean test

  # ---- Job 2 : Build Backend ----------------------------
  build-backend:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build .jar
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Upload .jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ---- Job 3 : Build + Push Frontend --------------------
  build-frontend:
    name: 🎨 Build + Push Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/idp-frontend:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/idp-frontend:${{ github.sha }} \
            ./frontend

      - name: Push image Frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/idp-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/idp-frontend:${{ github.sha }}

  # ---- Job 4 : Health Check -----------------------------
  # ---- Job 4 : Validate ---------------------------------
validate:
  name: ✅ Validation Pipeline
  runs-on: ubuntu-latest
  needs: [build-backend, build-frontend]

  steps:
    - name: Vérifier image Frontend sur Docker Hub
      run: |
        docker pull ${{ secrets.DOCKER_USERNAME }}/idp-frontend:latest
        echo "✅ Image Frontend disponible sur Docker Hub"

    - name: Vérifier artifact backend
      uses: actions/download-artifact@v4
      with:
        name: backend-jar

    - name: Vérifier .jar existe
      run: |
        ls -lh *.jar
        echo "✅ Backend .jar buildé avec succès"

    - name: Résumé
      if: always()
      run: |
        echo "================================"
        echo "✅ CI/CD IDP terminé !"
        echo "Backend  : .jar uploadé ✅"
        echo "Frontend : image Docker Hub ✅"
        echo "Branche  : ${{ github.ref_name }}"
        echo "Auteur   : ${{ github.actor }}"
        echo "================================"

  # ---- Job 5 : Notification échec ----------------------
  notify-failure:
    name: ❌ Notification Échec
    runs-on: ubuntu-latest
    needs: [test, build-backend, build-frontend, health-check]
    if: failure()

    steps:
      - name: Notifier échec
        run: |
          echo "❌ Pipeline IDP échoué !"
          echo "Commit  : ${{ github.sha }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "Auteur  : ${{ github.actor }}"